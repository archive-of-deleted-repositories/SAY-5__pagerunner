name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pagerunner
          POSTGRES_PASSWORD: pagerunner
          POSTGRES_DB: pagerunner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pagerunner"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://pagerunner:pagerunner@localhost:5432/pagerunner
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: pagerunner-artifacts
      S3_ACCESS_KEY: pagerunner
      S3_SECRET_KEY: pagerunner123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - name: start minio (S3-compatible) for artifact-uploader tests
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=pagerunner \
            -e MINIO_ROOT_PASSWORD=pagerunner123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then
              break
            fi
            sleep 1
          done
      - name: install chromium for playwright executor tests
        run: pnpm --filter @pagerunner/runner exec playwright install --with-deps chromium
      - run: pnpm test

  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - name: golden-flow smoke (FakeLLMProvider, 3 flows)
        run: pnpm eval run --suite golden_v1 --limit 3

  bench-regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - name: regress against committed 2000-run baseline (stable metrics only)
        run: |
          pnpm bench-regress \
            --baseline bench/results/2000runs_2026-05-07T20-06-10-959Z.json \
            --runs 50 --threshold 30

  replay-determinism-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      - name: replay every committed golden trace and assert score == 1.0
        run: pnpm replay:smoke

  build-images:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, eval-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-plane/Dockerfile
          push: false
          tags: ghcr.io/say-5/pagerunner-control-plane:sha-${{ github.sha }}
      - name: build runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          push: false
          tags: ghcr.io/say-5/pagerunner-runner:sha-${{ github.sha }}
