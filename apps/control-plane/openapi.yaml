openapi: 3.1.0
info:
  title: PageRunner Control Plane
  version: 0.1.0
servers:
  - url: http://localhost:3000
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200': { description: ok }
  /flows:
    post:
      summary: Create a flow version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFlow' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flow' }
  /flows/{id}:
    get:
      summary: Get latest flow version
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flow' }
        '404': { description: not found }
  /runs:
    get:
      summary: List runs
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/RunStatus' }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: page of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/Run' }
                  nextCursor: { type: string, nullable: true }
    post:
      summary: Create a run
      parameters:
        - in: header
          name: idempotency-key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flowId]
              properties:
                flowId: { type: string }
                inputs: { type: object, additionalProperties: true }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
  /runs/{id}:
    get:
      summary: Get run with full step list
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
  /runs/{id}/cancel:
    post:
      summary: Cancel a queued or running run
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: not cancellable }
  /runs/{id}/events:
    get:
      summary: SSE stream of run events
      description: |
        Returns text/event-stream with id, event, data lines per message.
        Pass `Last-Event-ID` to resume from a previous disconnect.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: last-event-id
          schema: { type: string }
      responses:
        '200':
          description: event stream
          content:
            text/event-stream:
              schema: { type: string }
  /artifacts/{runId}/{stepIdx}:
    get:
      summary: Presigned URL for a step artifact
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: stepIdx
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: presigned url
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresAt: { type: string, format: date-time }
components:
  schemas:
    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, dlq, cancelled]
    Flow:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        name: { type: string }
        dag: { type: object }
        createdAt: { type: string, format: date-time }
    CreateFlow:
      type: object
      required: [name, dag]
      properties:
        name: { type: string }
        dag: { type: object }
    Run:
      type: object
      properties:
        id: { type: string }
        flowId: { type: string }
        flowVersion: { type: integer }
        status: { $ref: '#/components/schemas/RunStatus' }
        inputs: { type: object }
        outputs: { type: object, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        costUsd: { type: string }
        errorCode: { type: string, nullable: true }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            steps:
              type: array
              items:
                type: object
                properties:
                  idx: { type: integer }
                  tool: { type: string }
                  input: { type: object }
                  output: { type: object, nullable: true }
                  status: { type: string }
                  latencyMs: { type: integer, nullable: true }
                  retryCount: { type: integer }
                  errorCode: { type: string, nullable: true }
